<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:#fff; font-family:system-ui,-apple-system,sans-serif; }
    .card { text-align:center; max-width:480px; padding:24px; }
    .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.15); border-top-color:#38bdf8; border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 20px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { font-size:18px; font-weight:600; margin-bottom:6px; letter-spacing:-0.01em; }
    #status { font-size:14px; color:#94a3b8; margin-bottom:8px; min-height:20px; }
    .log { font-size:11px; color:#64748b; margin-top:16px; max-width:100%; word-break:break-all; text-align:left; background:rgba(255,255,255,0.03); border-radius:8px; padding:10px 14px; display:none; max-height:160px; overflow-y:auto; line-height:1.6; }
    .log.visible { display:block; }
    .error-actions { margin-top:18px; display:none; }
    .error-actions.visible { display:block; }
    .error-actions a, .error-actions button { display:inline-block; margin:6px; padding:8px 18px; border-radius:6px; font-size:13px; text-decoration:none; cursor:pointer; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); color:#e2e8f0; transition:background .15s; }
    .error-actions a:hover, .error-actions button:hover { background:rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Completing sign-in</h1>
    <p id="status">Please wait while we finish setting up your session…</p>
    <div id="log" class="log"></div>
    <div id="errorActions" class="error-actions">
      <a href="/" id="retryLink">Back to sign in</a>
    </div>
  </div>

<!-- Load Supabase public env vars (window.__LOCI_ENV__) — must load before callback.js -->
<script src="/runtime-env.js"></script>
<!-- OAuth callback logic (external file — CSP-safe, no inline scripts) -->
<script src="/auth/callback.js" defer></script>
</body>
</html>
