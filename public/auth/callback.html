<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signing in…</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:#fff; font-family:system-ui,sans-serif; }
    .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.2); border-top-color:#38bdf8; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .log { font-size:12px; color:#94a3b8; margin-top:12px; max-width:420px; word-break:break-all; text-align:center; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <div class="spinner" style="margin:0 auto 16px"></div>
    <p id="status">Completing sign-in…</p>
    <div id="log" class="log"></div>
  </div>
<script>
(async () => {
  const el = (id) => document.getElementById(id);
  function say(msg) { el("log").innerHTML += msg + "<br>"; }

  const hash = window.location.hash.slice(1);
  say("url hash len: " + hash.length);

  const p = new URLSearchParams(hash);
  const accessToken = p.get("access_token");
  const refreshToken = p.get("refresh_token");
  const nonce = new URL(window.location).searchParams.get("nonce") || "";
  const next = new URL(window.location).searchParams.get("next") || "/";

  say("access_token: " + (accessToken ? accessToken.slice(0,15)+"..." : "MISSING"));
  say("refresh_token: " + (refreshToken ? refreshToken.slice(0,10)+"..." : "MISSING"));

  if (!accessToken || !refreshToken) {
    el("status").textContent = "No tokens in URL — OAuth may have failed.";
    el("status").style.color = "#ef4444";
    return;
  }

  el("status").textContent = "Exchanging tokens…";

  // 8-second timeout — Vercel hobby plan has 10s limit
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);

  try {
    const res = await fetch("/api/auth?action=exchange", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken, nonce }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);

    say("exchange HTTP " + res.status);

    if (!res.ok) {
      let errText = "";
      try { const j = await res.json(); errText = j.error || JSON.stringify(j); } catch { errText = await res.text(); }
      throw new Error("Exchange failed: " + errText);
    }

    el("status").textContent = "Done — redirecting…";
    window.location.replace(next);
  } catch (e) {
    clearTimeout(timer);
    el("status").textContent = e.name === "AbortError" ? "Exchange timed out (8s)" : "Exchange error";
    el("status").style.color = "#ef4444";
    say("ERROR: " + e.message);
  }
})();
</script>
</body>
</html>
